{bg:'#0a0d26',wv:'rgba(0,255,255,.22)',is:['#0ff','#141a46','#f0f'],grid:1},
{bg:'#7fb4d4',wv:'rgba(255,255,255,.5)',is:['#ffffff','#cfe8f5','#8cbcd8']},
{bg:'#240808',wv:'rgba(255,120,30,.45)',is:['#ff7a1a','#3a2a2a','#ff4a10']}];
function draw(){const T=TH[(stage-1)%5];X.fillStyle=T.bg;X.fillRect(0,0,W,H);X.fillStyle=T.wv;
if(T.grid){for(let i=0;i<=W;i+=24)X.fillRect(i,0,1,H);for(let y=(bgS%24)-24;y<H;y+=24)X.fillRect(0,Math.round(y),W,1)}
else for(let i=0;i<26;i++)X.fillRect((i*47)%W,((i*61+bgS)%(H+8))-4,7,1);
isl.forEach(i=>{const x=Math.round(i.x),y=Math.round(i.y);X.fillStyle=T.is[0];X.fillRect(x-3,y-3,i.w+6,i.h+6);X.fillStyle=T.is[1];X.fillRect(x,y,i.w,i.h);X.fillStyle=T.is[2];X.fillRect(x+6,y+5,6,6);X.fillRect(x+i.w-14,y+i.h-10,8,6)});
if(st=='title'){title();return}
it.forEach(i=>{X.fillStyle='#d22';X.fillRect(Math.round(i.x)-6,Math.round(i.y)-6,12,12);X.fillStyle='#fff';X.fillRect(Math.round(i.x)-6,Math.round(i.y)-6,12,1);tx('P',i.x,i.y+3,'#fff','center',7)});
en.forEach(e=>{if(e.vis===false)return;dr(IM[e.k],e.x,e.y);if(e.f>0){X.globalAlpha=.6;X.fillStyle='#fff';X.fillRect(Math.round(e.x-e.w/2),Math.round(e.y-e.h/2),e.w,e.h);X.globalAlpha=1}
if(e.k==4){X.fillStyle='#400';X.fillRect(70,26,100,4);X.fillStyle='#f33';X.fillRect(70,26,Math.max(0,100*e.hp/(70+stage*35)),4)}});
X.fillStyle='#ffe44a';pb.forEach(b=>X.fillRect(Math.round(b.x)-1,Math.round(b.y)-3,2,5));
eb.forEach(b=>{X.fillStyle='#ff5a3a';X.fillRect(Math.round(b.x)-2,Math.round(b.y)-2,4,4);X.fillStyle='#fff';X.fillRect(Math.round(b.x)-1,Math.round(b.y)-1,2,2)});
sm.forEach(q=>{X.globalAlpha=1-q.t/.35;X.fillStyle='#ddd';X.fillRect(Math.round(q.x)-1,Math.round(q.y)-1,2,2)});X.globalAlpha=1;
mb.forEach(m=>{X.save();X.translate(Math.round(m.x),Math.round(m.y));X.rotate(m.a+1.57);X.fillStyle='#fff';X.fillRect(-1,-3,2,5);X.fillStyle='#ff8a1a';X.fillRect(-1,2,2,2);X.restore()});
if(st=='play'&&P.dead<=0&&(P.inv<=0||(t*20|0)%2)){const rp=P.roll>0?1-P.roll/1.1:-1,sn=rp>=0?Math.sin(rp*Math.PI):0,k=1+.8*sn;
X.globalAlpha=.3;X.fillStyle='#000';const sw=Math.round(22*(1-.3*sn)),sh=Math.round(9*(1-.3*sn));X.fillRect(Math.round(P.x+6+10*sn-sw/2),Math.round(P.y+9+14*sn-sh/2),sw,sh);X.globalAlpha=1;
X.save();X.translate(Math.round(P.x),Math.round(P.y-12*sn));if(rp>=0)X.scale(k,Math.cos(rp*Math.PI*2)*k);
X.drawImage(SP.p,-12,-9);if(wl>=4){X.drawImage(SP.p,-34,-2,12,9);X.drawImage(SP.p,22,-2,12,9)}X.restore()}
ex.forEach(o=>{const p=o.t/.5,r=p*(o.b?26:14);X.fillStyle=p<.3?'#fff':p<.6?'#ffd23a':'#e5481c';for(let i=0;i<8;i++){const a=i*.785+o.s;X.fillRect(Math.round(o.x+Math.cos(a)*r)-1,Math.round(o.y+Math.sin(a)*r)-1,3,3)}const s=Math.round((1-p)*(o.b?9:5));X.fillRect(Math.round(o.x-s/2),Math.round(o.y-s/2),s,s)});
tx('1UP',6,10,'#ff6',  'left',7);tx(pad(score),6,20,'#fff','left',7);tx('HI',150,10,'#f66','center',7);tx(pad(Math.max(hi,score)),150,20,'#fff','center',7);
for(let i=0;i<lives;i++)X.drawImage(SP.p,4+i*14,H-13,12,9);tx('STAGE '+stage+'  ROLL x'+rolls,6,H-17,'#9cf','left',6);
if(banner>0&&st=='play')btxt.forEach((s,i)=>tx(s,W/2,120+i*16,i?'#fff':'#ffd23a','center',i?8:12));
if(st=='over'){X.fillStyle='rgba(0,0,0,.55)';X.fillRect(0,90,W,110);tx('GAME OVER',W/2,125,'#f55','center',14);tx('SCORE '+pad(score),W/2,150,'#fff','center',9);if(score>=hi&&score>0)tx('NEW HI-SCORE!',W/2,168,'#ffd23a','center',8);if(overT<=0)tx('TAP TO RETRY',W/2,190,'#9f9','center',8)}
const mt='MISSILE '+ammo;if(MB.textContent!=mt)MB.textContent=mt}
function title(){tx("SKY RAID",W/2,50,'#ffd23a','center',20);tx("'42",W/2,78,'#f55','center',24);
const rows=[[SP.g,'100',1],[SP.r,'x5 = POW!',1],[SP.m,'500',.8],[SP.b,'1000',.6],[SP.B,'5000',.5]];
rows.forEach((r,i)=>{const y=118+i*26,w=r[0].width*r[2],h=r[0].height*r[2];X.drawImage(r[0],Math.round(60-w/2),Math.round(y-h/2),w,h);tx(r[1],100,y+3,'#fff','left',8)});
tx('HI '+pad(hi),W/2,252,'#f66','center',8);if((performance.now()/500|0)%2)tx('TAP TO START',W/2,278,'#9f9','center',9);
X.font='9px sans-serif';X.textAlign='center';X.fillStyle='#fff';X.fillText('拖曳移動·自動射擊·雙擊翻滾·按鈕發射追蹤彈',W/2,300)}
/* ===== INPUT ===== */
let lp=null,lastTap=0;
C.addEventListener('pointerdown',e=>{initAudio();lp=[e.clientX,e.clientY];const n=performance.now();if(st=='play'&&n-lastTap<280)roll();lastTap=n;if(st=='title'||(st=='over'&&overT<=0))start()});
addEventListener('pointermove',e=>{if(!lp)return;const k=W/C.getBoundingClientRect().width;if(st=='play'&&P.dead<=0){P.x+=(e.clientX-lp[0])*k*1.3;P.y+=(e.clientY-lp[1])*k*1.3}lp=[e.clientX,e.clientY]});
addEventListener('pointerup',()=>lp=null);addEventListener('pointercancel',()=>lp=null);
addEventListener('keydown',e=>{K[e.key]=1;if(e.key==' '){e.preventDefault();initAudio();if(st=='play')roll();else if(st=='title'||(st=='over'&&overT<=0))start()}if(e.key=='m')tm()});
addEventListener('keyup',e=>K[e.key]=0);
const MB=$('msl');MB.addEventListener('pointerdown',e=>{e.stopPropagation();initAudio();hold=1});['pointerup','pointercancel','pointerleave'].forEach(n=>MB.addEventListener(n,()=>hold=0));
function tm(){muted=!muted;if(master)master.gain.value=muted?0:.5;$('mute').textContent=muted?'♪ OFF':'♪ ON'}
$('mute').addEventListener('pointerdown',e=>{e.stopPropagation();initAudio();tm()});
reset();st='title';
let last=0;function loop(n){const dt=Math.min(.033,(n-last)/1000||0);last=n;upd(dt);draw();requestAnimationFrame(loop)}requestAnimationFrame(loop);
</script></body></html>
